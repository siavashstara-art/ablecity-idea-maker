name: Build & Sign Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # تشخیص هوشمند ساختار مخزن
      - name: Detect Project Type & Prepare Android Source
        id: prep
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "Standalone Android Gradle project detected."
            echo "working_dir=." >> $GITHUB_OUTPUT
          else
            echo "React Web repository detected. Generating Android project from manifest..."
            npm install
            npm run generate:android
            echo "working_dir=android-build" >> $GITHUB_OUTPUT
          fi

      # نصب JDK 17 بدون کش شکننده
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # اکشن رسمی گریدل با کش داینامیک و امن
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ steps.prep.outputs.working_dir }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: ${{ steps.prep.outputs.working_dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Configure Keystore & Signing Secrets
        id: signing_setup
        working-directory: ${{ steps.prep.outputs.working_dir }}
        run: |
          KEYSTORE_FILE="release-key.jks"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Secrets not found. Generating automated CI Keystore..."
            PASS="CI_AutoSecret_${RANDOM}_${RANDOM}"
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -alias "tavana_ci_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=TavanaForge, OU=CI, O=Tavana, L=Tehran, ST=Tehran, C=IR"
            
            echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=tavana_ci_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$PASS" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        working-directory: ${{ steps.prep.outputs.working_dir }}
        run: |
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Build Release AAB (Android App Bundle for Google Play & Bazaar)
        working-directory: ${{ steps.prep.outputs.working_dir }}
        run: |
          ./gradlew bundleRelease --stacktrace || gradle bundleRelease --stacktrace

      - name: Verify Artifacts
        working-directory: ${{ steps.prep.outputs.working_dir }}
        run: |
          echo "=== Built Artifacts ==="
          ls -lh app/build/outputs/apk/release/ || true
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tavana-signed-release-apk
          path: ${{ steps.prep.outputs.working_dir }}/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Signed AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tavana-signed-release-aab
          path: ${{ steps.prep.outputs.working_dir }}/app/build/outputs/bundle/release/*.aab
          retention-days: 14
